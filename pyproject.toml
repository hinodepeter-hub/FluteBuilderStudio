[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "flutebuilder"
version = "0.1.0-alpha"
description = "Open-source desktop application for designing, documenting, building and tuning bamboo flutes."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [
    { name = "Peter" }
]

dependencies = [
    "PySide6>=6.9",
    "pydantic>=2.11",
    "PyYAML>=6.0"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "ruff",
    "mypy"
]

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
